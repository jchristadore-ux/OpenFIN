<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Background (transparent) -->
  <rect width="800" height="500" fill="none"/>

  <!-- Icon: Open door / portal + rising chart -->
  <g transform="translate(280, 40)">
    <!-- Left door panel (navy) -->
    <path d="M40 20 L40 180 L110 180 L110 20 Z" fill="#0A2540"/>
    <!-- Door handle / pivot -->
    <circle cx="100" cy="100" r="6" fill="#0A2540"/>

    <!-- Open right side / portal frame (teal) -->
    <path d="M120 20 L200 20 L200 180 L160 180 L160 60 L120 60 Z" fill="none" stroke="#00C2A8" stroke-width="18" stroke-linejoin="round"/>

    <!-- Rising bars -->
    <rect x="175" y="130" width="18" height="50" rx="3" fill="#00C2A8"/>
    <rect x="200" y="100" width="18" height="80" rx="3" fill="#00C2A8"/>
    <rect x="225" y="70"  width="18" height="110" rx="3" fill="#00C2A8"/>

    <!-- Upward arrow -->
    <path d="M235 55 L255 35 L275 55" fill="none" stroke="#00C2A8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="255" y1="35" x2="255" y2="75" stroke="#00C2A8" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="400" y="310" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="700" text-anchor="middle">
    <tspan fill="#0A2540">Open</tspan><tspan fill="#00C2A8">FIN</tspan>
  </text>

  <!-- Tagline -->
  <text x="400" y="370" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#4A5568" text-anchor="middle" letter-spacing="4">
    FAMILY FINANCIAL OPERATING SYSTEM
  </text>

  <!-- Decorative lines under tagline -->
  <line x1="180" y1="370" x2="250" y2="370" stroke="#0A2540" stroke-width="2"/>
  <line x1="550" y1="370" x2="620" y2="370" stroke="#00C2A8" stroke-width="2"/>
</svg>
