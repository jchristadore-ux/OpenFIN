<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A2540">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OpenFIN">
<link rel="icon" href="assets/mark.svg">
<link rel="apple-touch-icon" href="assets/mark.svg">
<title>OpenFIN</title>
<!-- Replaced by the Worker when it serves this page, so the app knows it is
     running first-party and posts to its own origin. Left as a comment when
     GitHub Pages serves it. Do not remove: worker/index.js looks for it. -->
<!--OPENFIN_HOST-->
<style>
  /* Mobile first and mobile only, really. Opened one-handed on a phone while
     standing in a kitchen. Everything that matters is above the fold, and the
     one thing the household has to DO is the first thing they can reach. */
  :root{
    --navy:#0A2540; --navy-d:#06182a; --teal:#00C2A8; --teal-d:#009c87;
    --ink:#0A2540; --mute:#4A5568; --line:#e2e8f0; --bg:#f4f7f9; --card:#fff;
    --danger:#b91c1c; --warn:#b45309; --ok:#0f766e;
    --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 28px)}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}

  header{padding:18px 0 12px;display:flex;align-items:center;gap:11px}
  header img{width:42px;height:42px;flex:0 0 42px}
  .brand{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1}
  .brand .a{color:var(--navy)} .brand .b{color:var(--teal)}
  .tag{font-size:9.5px;letter-spacing:.19em;text-transform:uppercase;color:var(--mute);
    font-weight:600;margin-top:4px}

  .stale{background:#fef3c7;border:1px solid #fcd34d;color:#78350f;border-radius:10px;
    padding:11px 13px;font-size:13.5px;margin-bottom:12px}

  /* one-time setup: where the Worker lives. Shown only until it is known. */
  .setup{background:#fff;border:1px solid var(--line);border-left:4px solid var(--teal);
    border-radius:10px;padding:14px;margin-bottom:12px;font-size:13.5px;line-height:1.5}
  .setup h3{margin:0 0 6px;font-size:15px}
  .setup .rowin{display:flex;gap:8px;margin-top:10px}
  .setup input{flex:1;min-width:0;padding:12px;border:1px solid var(--line);
    border-radius:10px;font-size:16px;font-family:inherit}
  .setup button{border:0;border-radius:10px;background:var(--teal);color:#04231e;
    font-weight:700;font-size:15px;padding:12px 16px;cursor:pointer}
  .setup .note{margin-top:8px;opacity:.7;font-size:12.5px}
  .setup .bad{color:#b91c1c;font-weight:600}

  /* the one input the household is responsible for */
  .bal{background:linear-gradient(135deg,var(--navy),var(--navy-d));color:#fff;
    border-radius:var(--r);padding:18px;margin-bottom:12px}
  .bal .lab{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    opacity:.72;font-weight:700}
  .bal .amt{font-size:40px;font-weight:800;letter-spacing:-.02em;margin:5px 0 3px}
  .bal .when{font-size:12.5px;opacity:.72}
  .entry{display:flex;gap:8px;margin-top:14px}
  .entry .fld{flex:1;position:relative}
  .entry .fld span{position:absolute;left:13px;top:50%;transform:translateY(-50%);
    color:var(--mute);font-weight:700;font-size:18px;pointer-events:none}
  .entry input{width:100%;padding:14px 12px 14px 28px;border:0;border-radius:10px;
    font-size:18px;font-weight:700;color:var(--ink);background:#fff;
    font-family:inherit;-moz-appearance:textfield}
  .entry input::-webkit-outer-spin-button,.entry input::-webkit-inner-spin-button{
    -webkit-appearance:none;margin:0}
  .entry button{border:0;border-radius:10px;background:var(--teal);color:#04231e;
    font-weight:800;font-size:15px;padding:0 20px;font-family:inherit;cursor:pointer}
  .entry button:active{background:var(--teal-d)}
  .entry button:disabled{opacity:.55;cursor:default}
  .msg{margin-top:10px;font-size:13px;line-height:1.45;opacity:.95}
  .msg a{color:var(--teal)}
  .msg.bad{color:#fecaca}

  /* the headline answer */
  .disc{background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:12px;
    border:1px solid var(--line);border-left:5px solid var(--teal)}
  .disc.neg{border-left-color:var(--danger)}
  .disc .lab{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--mute);font-weight:700}
  .disc .amt{font-size:42px;font-weight:800;letter-spacing:-.02em;
    color:var(--ok);margin:4px 0}
  .disc.neg .amt{color:var(--danger)}
  .disc .sub{font-size:13.5px;color:var(--mute)}
  .disc.neg .sub{color:var(--danger);font-weight:600}

  details{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    margin-bottom:10px;overflow:hidden}
  summary{list-style:none;cursor:pointer;padding:15px 16px;display:flex;
    align-items:center;gap:10px;font-weight:600;font-size:15px}
  summary::-webkit-details-marker{display:none}
  summary::after{content:"";margin-left:auto;width:8px;height:8px;flex:0 0 8px;
    border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);
    transform:rotate(45deg);transition:transform .18s}
  details[open] summary::after{transform:rotate(-135deg)}
  summary .n{margin-left:auto;font-weight:700;font-size:15px;white-space:nowrap}
  summary .n + ::after{margin-left:10px}
  .body{padding:0 16px 15px;border-top:1px solid var(--line);padding-top:12px}

  .row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;
    border-bottom:1px solid #f1f5f9;font-size:14.5px}
  .row:last-child{border-bottom:0}
  .row .l{color:#334155;min-width:0}
  .row .l small{display:block;color:var(--mute);font-size:12px}
  .row .v{font-weight:600;white-space:nowrap}
  .in .v{color:var(--ok)}
  /* A deferred occurrence is shown struck through wherever it is listed, and
     left out of the totals beside it. It is still owed; it is just not leaving
     the account on that date. */
  .row.dfd .l{color:var(--mute)}
  .row.dfd .l .nm{text-decoration:line-through}
  .row.dfd .v{color:var(--warn);text-decoration:line-through}
  .row.owe .v{color:var(--warn)}

  /* Removing a bill is staged, not immediate: struck through until Save, so a
     mis-tap on a phone costs a second tap and not the household's model. */
  .e-del,.e-restore,.i-del,.i-restore{border:1px solid var(--line);background:#fff;
    color:var(--mute);border-radius:8px;font:inherit;cursor:pointer}
  .e-del,.i-del{width:30px;height:32px;flex:0 0 30px;font-size:17px;line-height:1;padding:0}
  .e-restore,.i-restore{font-size:13px;font-weight:600;padding:6px 12px}
  .e-del:active,.e-restore:active,.i-del:active,.i-restore:active{background:#f1f5f9}
  .e-del:disabled,.i-del:disabled,.i-restore:disabled{opacity:.5}
  .row.rm{background:#fef2f2;margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:8px}
  .row.rm .nm{text-decoration:line-through;color:var(--danger)}
  .row.rm .e-del,.row.rm .i-del{border-color:#fca5a5;color:var(--danger)}
  .row.rm .v span{text-decoration:line-through}
  .row.back{background:#ecfdf5;margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:8px}
  .row.back .nm{color:var(--ok)!important;font-weight:600}

  /* Add income. Full-width controls at 16px, because anything smaller makes
     iOS zoom the page on focus and the household loses their place. */
  .addinc input,.addinc select{width:100%;padding:12px;border:1px solid var(--line);
    border-radius:10px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
  .addinc .two{display:flex;gap:8px;margin-top:8px}
  .addinc .two .fld{flex:1;position:relative;min-width:0}
  .addinc .two .fld span{position:absolute;left:12px;top:50%;transform:translateY(-50%);
    color:var(--mute);font-weight:700;pointer-events:none}
  .addinc .two .fld input{padding-left:26px;text-align:right}
  .addinc .two select{flex:1.15;min-width:0;-webkit-appearance:none;appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),
      linear-gradient(135deg,var(--mute) 50%,transparent 50%);
    background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px}
  .addinc .dl{display:block;margin-top:8px;font-size:12.5px;color:var(--mute);font-weight:600}
  .addinc .dl input{margin-top:4px}
  .addinc button{border:0;border-radius:10px;background:var(--teal);color:#04231e;
    font-weight:800;font-size:14px;padding:11px 18px;font-family:inherit;cursor:pointer}
  .addinc button:disabled{opacity:.55;cursor:default}
  .addinc .bad{color:var(--danger);font-weight:600}
  .tot{border-top:2px solid var(--line);margin-top:6px;padding-top:10px;font-weight:700}
  .empty{color:var(--mute);font-size:14px;padding:6px 0}

  .pill{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;padding:2px 7px;border-radius:999px;margin-left:6px;
    vertical-align:1px}
  .t1{background:#fee2e2;color:#991b1b} .t2{background:#ffedd5;color:#9a3412}
  .t3{background:#e0e7ff;color:#3730a3} .t4{background:#ccfbf1;color:#0f766e}
  .t5{background:#eef2f6;color:#4A5568}

  .risk{border-left:5px solid var(--danger)}
  .risk .sev{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    font-weight:800;color:var(--danger)}
  .risk h4{margin:3px 0 4px;font-size:15px}
  .risk p{margin:0 0 12px;font-size:13.5px;color:var(--mute);line-height:1.5}
  .ok{color:var(--ok);font-weight:600;font-size:14.5px}
  .plan{background:#f4f7f9;border-radius:10px;padding:12px;font-size:13.5px;
    line-height:1.5;margin-top:4px}

  .spark{display:flex;align-items:flex-end;gap:1px;height:52px;margin:10px 0 4px}
  .spark i{flex:1;background:var(--teal);border-radius:1px 1px 0 0;min-height:1px}
  .spark i.neg{background:var(--danger)}

  .dfr{display:flex;align-items:center;gap:11px;padding:9px 0;
    border-bottom:1px solid #f1f5f9;font-size:14.5px}
  .dfr:last-of-type{border-bottom:0}
  .dfr input[type=checkbox]{width:22px;height:22px;flex:0 0 22px;accent-color:var(--teal);margin:0}
  .dfr .nm{flex:1;min-width:0}
  .dfr .nm small{display:block;color:var(--mute);font-size:12px}
  .dfr .amt{font-weight:600;white-space:nowrap}
  .dfr.on .nm{text-decoration:line-through;color:var(--mute)}
  .dfr.on .amt{color:var(--warn)}
  .dfr.sec{background:#fff7ed;margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:8px}
  .grp{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);
    font-weight:700;margin:14px 0 4px}
  .live{background:var(--navy);color:#fff;border-radius:10px;padding:12px 14px;margin:14px 0 10px}
  .live .a{font-size:26px;font-weight:800;letter-spacing:-.02em}
  .live .b{font-size:12.5px;opacity:.8;margin-top:2px}
  .live.good .a{color:#5eead4} .live.bad .a{color:#fca5a5}
  .owed{font-size:12.5px;color:var(--warn);margin-top:6px;font-weight:600}
  .lnk{background:none;border:0;color:var(--teal);font:inherit;font-size:13px;
    padding:0;cursor:pointer;text-decoration:underline}
  footer{color:var(--mute);font-size:11.5px;text-align:center;padding:16px 0 4px}
  .err{background:#fee2e2;border:1px solid #fca5a5;color:#7f1d1d;padding:14px;
    border-radius:var(--r);font-size:14px}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <img src="assets/mark.svg" alt="">
    <div>
      <div class="brand"><span class="a">Open</span><span class="b">FIN</span></div>
      <div class="tag">Family Financial Operating System</div>
    </div>
  </header>

  <div id="app"><div class="err">Loading…</div></div>

  <footer id="foot"></footer>
</div>

<script>
// The dashboard renders snapshot.json and computes nothing. Every figure was
// produced by src/engine.py. If a number looks wrong it is wrong in the engine,
// and there is exactly one place to fix it.
// Where the Worker lives. The Worker holds the GitHub token server-side and
// sits behind Cloudflare Access, so no credential is ever entered or stored on
// a phone — only this address, which is not a secret.
//
// The Worker also serves this page. When it does, WORKER_HOSTED is true and
// every write goes to our own origin: no cross-site request, no CORS preflight
// for Access to reject, and a first-party sign-in cookie the browser will
// actually send. Served from GitHub Pages instead, writes are cross-site and a
// browser that blocks third-party cookies — Safari does, by default — will
// refuse them however the request is framed. Reading works from either place.
//
// Two sources for the address, device first:
//   1. localStorage, set by pasting the URL into the setup box in the app.
//      Takes effect immediately and needs no commit, but is per-device.
//   2. app.json in this repository, which every device picks up. Editable on
//      github.com with no terminal.
// The device value wins so a phone can be pointed at a new Worker without
// waiting on a commit.
const WORKER_KEY = 'openfin.worker';
const WORKER_HOSTED = !!window.OPENFIN_WORKER_HOSTED;
let WORKER = '';

function workerFromDevice(){
  try { return localStorage.getItem(WORKER_KEY) || ''; } catch(e){ return ''; }
}
function saveWorkerOnDevice(url){
  try { localStorage.setItem(WORKER_KEY, url); } catch(e){ /* private mode */ }
}
function forgetWorkerOnDevice(){
  try { localStorage.removeItem(WORKER_KEY); } catch(e){ /* private mode */ }
}

/** Accept what someone actually pastes; reject what cannot work. */
function cleanWorkerUrl(raw){
  let s = String(raw || '').trim().replace(/\/+$/, '');
  if(!s) return null;
  if(!/^https?:\/\//i.test(s)) s = 'https://' + s;
  let u;
  try { u = new URL(s); } catch(e){ return null; }
  // http:// would send the request in the clear and Access would not be in
  // front of it. Refuse rather than half-work.
  if(u.protocol !== 'https:') return null;
  if(!u.hostname.includes('.')) return null;
  return u.origin + u.pathname.replace(/\/+$/, '');
}

async function loadWorkerUrl(){
  // Served by the Worker: it is its own address, whatever app.json says.
  if(WORKER_HOSTED){ WORKER = location.origin; return; }
  const device = workerFromDevice();
  if(device){ WORKER = device; return; }
  try{
    const r = await fetch('app.json?t=' + Date.now());
    if(r.ok){
      const cfg = await r.json();
      WORKER = cleanWorkerUrl(cfg.worker_url) || '';
    }
  }catch(e){ /* app.json missing or unparseable; the setup box handles it */ }
}

/** What to tell someone whose write never reached the Worker at all. */
function unreachable(){
  if(WORKER_HOSTED){
    return 'Lost contact with OpenFIN — the sign-in may have expired. '
      + 'Reload this page and try again.';
  }
  return 'This browser blocked the request. Saving cannot work from this '
    + 'address because the sign-in cookie belongs to ' + esc(WORKER) + ', and '
    + 'browsers do not send another site’s cookie. Open '
    + `<a href="${esc(WORKER)}/">${esc(WORKER)}</a> and use OpenFIN from there `
    + '— same app, same numbers, and saving works.';
}

async function post(path, payload){
  if(!WORKER){
    throw new Error('The Worker address is not set yet. Use the setup box '
      + 'above to paste it in.');
  }
  // Relative when the Worker serves us, so the request is same-origin.
  const target = WORKER_HOSTED ? path : WORKER + path;
  let res;
  try{
    res = await fetch(target, {
      method:'POST', credentials:'include',
      // 'manual' so an expired Access session comes back as a redirect we can
      // name, instead of a bare "Failed to fetch" that says nothing.
      redirect:'manual',
      // text/plain keeps this a simple request, so the browser sends no CORS
      // preflight. Cloudflare Access answers an unauthenticated preflight —
      // and a preflight never carries cookies — with a login redirect, which a
      // preflight is not allowed to follow. The Worker parses the body as JSON
      // regardless of the label.
      headers:{'Content-Type':'text/plain;charset=UTF-8'},
      body: JSON.stringify(payload)
    });
  }catch(e){
    throw new Error(unreachable());
  }
  if(res.type === 'opaqueredirect' || res.status === 0){
    throw new Error('Sign-in has expired. Reload this page, enter the email '
      + 'code, then try again.');
  }
  let data = {};
  try { data = await res.json(); } catch(e){ /* non-JSON error page */ }
  if(res.status === 202) return data;
  if(res.status === 401 || res.status === 403){
    throw new Error('Sign-in needed. Open '
      + `<a href="${esc(WORKER)}/">${esc(WORKER)}</a> in this browser to get `
      + 'the email code, then try again.');
  }
  // Every message thrown here is HTML, because some of them carry a link. The
  // Worker's own text is escaped at the point it enters one.
  throw new Error(data.error ? esc(data.error) : ('Request failed: ' + res.status));
}

const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = (s) => Number(String(s).replace(/[$,]/g, ''));
const m = (v) => { const n = num(v); const a = Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); return (n<0?'-$':'$') + a; };
const dt = (iso) => { const d = new Date(iso + 'T12:00:00'); return d.toLocaleDateString('en-US',{weekday:'short',day:'numeric',month:'short'}); };

function tile(title, note, inner, cls='', open=false){
  return `<details ${open?'open':''} class="${cls}">
    <summary>${esc(title)}${note?`<span class="n">${esc(note)}</span>`:''}</summary>
    <div class="body">${inner}</div></details>`;
}
// Deferred occurrences are listed like everything else and struck through.
// They are excluded from the totals beside them, because they are not leaving
// the account — but never from the list, because they are still owed.
const live = (list) => (list || []).filter(x => !x.deferred);
const held = (list) => (list || []).filter(x => x.deferred);
const sum  = (list) => (list || []).reduce((a,b) => a + num(b.amount), 0);

function rows(list, dir){
  if(!list.length) return '<div class="empty">Nothing scheduled.</div>';
  return list.map(x => `<div class="row ${dir==='in'?'in':''} ${x.deferred?'dfd':''}">
      <div class="l"><span class="nm">${esc(x.name)}</span>${x.tier?`<span class="pill t${x.tier}">T${x.tier}</span>`:''}
        ${x.date?`<small>${dt(x.date)}${x.deferred?' · deferred — still owed':''}</small>`
                :(x.deferred?'<small>deferred — still owed</small>':'')}</div>
      <div class="v">${dir==='in'?'+':''}${m(x.amount)}</div></div>`).join('');
}

/** A footer line for what was deferred out of the total just shown. */
function owedRow(list, label){
  const total = sum(held(list));
  if(!total) return '';
  return `<div class="row owe"><div class="l">${esc(label)}
      <small>deferred, not paid on the date — still owed</small></div>
    <div class="v">${m(total)}</div></div>`;
}

// ---- one-time setup ------------------------------------------------------
function saveWorkerUrl(){
  const input = document.getElementById('wkin');
  const note = document.getElementById('wknote');
  const url = cleanWorkerUrl(input.value);
  if(!url){
    note.className = 'note bad';
    note.textContent = 'That is not a usable https address. It should look like '
      + 'https://openfin.yourname.workers.dev';
    input.focus();
    return;
  }
  saveWorkerOnDevice(url);
  WORKER = url;
  const box = document.getElementById('setup');
  if(box) box.remove();
}

// ---- balance entry -------------------------------------------------------
// Writing goes through the Worker, which holds the GitHub token server-side
// behind Cloudflare Access. Nothing is stored on the device. Updating the
// balance is what runs the engine and sends the daily summary — there is no
// separate "balance received" email, and nothing is emailed to submit one.
function setMsg(html, bad){
  const el = document.getElementById('msg');
  if(el){ el.className = 'msg' + (bad ? ' bad' : ''); el.innerHTML = html; }
}

async function submitBalance(){
  const input = document.getElementById('balin');
  const btn = document.getElementById('balbtn');
  const raw = (input.value || '').replace(/[$,\s]/g, '');
  if(raw === '' || isNaN(Number(raw))){ setMsg('Enter a number.', true); input.focus(); return; }

  btn.disabled = true; btn.textContent = '…';
  setMsg('Sending…');
  try{
    await post('/balance', {balance: raw});
    setMsg('Balance sent. The engine is running — your daily summary email is on its way. '
         + 'This page refreshes when the new forecast lands.');
    input.value = '';
    pollForSnapshot();
  } catch(e){
    setMsg(e.message + ' Nothing was recorded.', true);
  } finally {
    btn.disabled = false; btn.textContent = 'Update';
  }
}

// ---- bill editing --------------------------------------------------------
// Routine amount and date changes. Structural changes (new bills, payoffs,
// frequency changes) still go through review, because those need checking
// against the statements before they enter the forecast.
function collectEdits(){
  const edits = [];
  document.querySelectorAll('[data-bill]').forEach(row => {
    const id = row.getAttribute('data-bill');
    const amt = row.querySelector('.e-amt');
    const day = row.querySelector('.e-day');
    const out = {id};
    // Removal is a staged change like any other, so it goes through the same
    // Save and can be undone before it is sent.
    if(row.classList.contains('rm')) out.active = false;
    else if(row.classList.contains('back')) out.active = true;
    else {
      if(amt && amt.value !== '' && amt.value !== amt.defaultValue) out.amount = amt.value;
      if(day && day.value !== '' && day.value !== day.defaultValue) out.due_day = Number(day.value);
    }
    if(Object.keys(out).length > 1) edits.push(out);
  });
  return edits;
}

// Removing a bill does not delete it — it is marked inactive and kept, because
// the statement history is keyed to the id and a bill that turns out to still
// be live has to be able to come back. Saving rebuilds the forecast without it:
// this week, upcoming, the curve, safe-to-spend and the risks all follow.
function markRemoval(row){
  const on = row.classList.toggle('rm');
  const btn = row.querySelector('.e-del');
  if(btn){ btn.textContent = on ? '↺' : '×'; btn.title = on ? 'Keep this bill' : 'Remove this bill'; }
  row.querySelectorAll('input').forEach(i => { i.disabled = on || i.dataset.wasDisabled === '1'; });
  editHint();
}
function markRestore(row){
  const on = row.classList.toggle('back');
  const btn = row.querySelector('.e-restore');
  if(btn) btn.textContent = on ? 'Undo' : 'Restore';
  editHint();
}
function editHint(){
  const msg = document.getElementById('editmsg');
  if(!msg) return;
  const rm = document.querySelectorAll('[data-bill].rm').length;
  const back = document.querySelectorAll('[data-bill].back').length;
  const bits = [];
  if(rm) bits.push(`${rm} to remove`);
  if(back) bits.push(`${back} to restore`);
  msg.textContent = bits.length ? bits.join(', ') + ' — press Save changes.' : '';
}

async function saveEdits(){
  const btn = document.getElementById('savebills');
  const msg = document.getElementById('editmsg');
  const edits = collectEdits();
  if(edits.length === 0){ msg.textContent = 'Nothing changed.'; return; }
  btn.disabled = true; btn.textContent = 'Saving…';
  msg.innerHTML = '';
  try{
    const r = await post('/bills', {edits});
    msg.innerHTML = `Saved ${r.count} change${r.count>1?'s':''}. The whole forecast `
      + 'is rebuilding — safe to spend, this week, upcoming, the curve and the '
      + 'risks all follow. This page refreshes when it lands.';
    pollForSnapshot();
  } catch(e){
    msg.innerHTML = e.message + ' Nothing was saved.';
  } finally {
    btn.disabled = false; btn.textContent = 'Save changes';
  }
}

// ---- income --------------------------------------------------------------
// Four answers and nothing else: what it is, how much, how often, and one date.
// The engine derives the id, decides which of the three date fields that date
// belongs in, and flags the entry for review — a phone never writes a field it
// does not understand.
//
// The date question changes with the frequency because the answer means
// different things: a one-off falls on that date, a weekly income is anchored
// to it, a monthly one takes its day of the month from it.
function incomeDateLabel(){
  const freq = document.getElementById('inc-freq').value;
  const lab = document.getElementById('inc-datelab');
  if(!lab) return;
  lab.textContent = freq === 'once' ? 'What date does it land?'
    : (freq === 'weekly' || freq === 'biweekly') ? 'When is the next one?'
    : 'When is the first one?';
}

async function addIncome(){
  const btn = document.getElementById('addinc');
  const msg = document.getElementById('incmsg');
  const name = document.getElementById('inc-name');
  const amt = document.getElementById('inc-amt');
  const freq = document.getElementById('inc-freq');
  const date = document.getElementById('inc-date');
  const fail = (why, el) => { msg.className = 'bad'; msg.textContent = why; if(el) el.focus(); };

  msg.className = ''; msg.textContent = '';
  if(name.value.trim().length < 2) return fail('Give it a name.', name);
  if(amt.value === '' || !(Number(amt.value) > 0)) return fail('How much is it?', amt);
  if(!date.value) return fail('Pick the date it lands.', date);

  btn.disabled = true; btn.textContent = 'Adding…';
  msg.textContent = 'Adding…';
  try{
    await post('/income', {add: {
      name: name.value.trim(), amount: amt.value,
      frequency: freq.value, date: date.value
    }});
    msg.innerHTML = `Added. The forecast is rebuilding with it — safe to spend, `
      + 'the curve and the risks all follow. This page refreshes when it lands. '
      + 'It stays flagged for review until it turns up on a statement.';
    name.value = ''; amt.value = ''; date.value = '';
    pollForSnapshot();
  } catch(e){
    msg.className = 'bad'; msg.innerHTML = e.message + ' Nothing was added.';
  } finally {
    btn.disabled = false; btn.textContent = 'Add income';
  }
}

// Removing an income deactivates it, exactly like a bill: kept, not deleted,
// and restorable. Sent immediately rather than staged — there is no Save button
// on this tile, and an income counted in error is the direction that overstates
// what is safe to spend, so it should be undoable in one tap.
async function setIncomeActive(row, active){
  const msg = document.getElementById('incmsg');
  const btn = row.querySelector('button');
  msg.className = ''; msg.textContent = active ? 'Restoring…' : 'Removing…';
  btn.disabled = true;
  try{
    await post('/income', {edits: [{id: row.getAttribute('data-income'), active}]});
    row.classList.add(active ? 'back' : 'rm');
    msg.textContent = (active ? 'Restored. ' : 'Removed. ')
      + 'The forecast is rebuilding; this page refreshes when it lands.';
    pollForSnapshot();
  } catch(e){
    msg.className = 'bad'; msg.innerHTML = e.message + ' Nothing changed.';
    btn.disabled = false;
  }
}

// The workflow commits a new snapshot.json. Watch for generated_at to change,
// then re-render. Gives up quietly rather than spinning forever.
let baseline = null;
function pollForSnapshot(){
  let tries = 0;
  const tick = setInterval(async () => {
    tries++;
    if(tries > 40){ clearInterval(tick); return; }
    try{
      const r = await fetch('snapshot.json?t=' + Date.now());
      if(!r.ok) return;
      const s = await r.json();
      if(s.generated_at !== baseline){ clearInterval(tick); render(s); }
    }catch(e){ /* transient; keep waiting */ }
  }, 6000);
}

// ---- live deferral maths -------------------------------------------------
// Mirrors forecast.available(). Two numbers, both read straight off the curve,
// with nothing assumed, held back, or charged on the household's behalf:
//
//   headroom = the lowest closing balance in the window. Money spent today
//              comes off every later day, so the low point is the limit.
//   per day  = min over the window of closing(n) / n, counting today as day 1.
//              Spending x a day means n*x is gone by day n.
//
// Verified against the engine: same inputs produce the same cent.
//
// Ticking a box needs no round trip. Deferring a bill means its money does not
// leave on its date, so every projected day from that date onward is higher by
// that amount — and un-deferring one lowers them again. Applying that to the
// curve the engine already sent redoes both figures exactly.
let SNAP = null;

function spendable(shifts){
  const end = SNAP.discretionary.components.window_end;
  let headroom = null, headroomDay = null, perDay = null, perDayDay = null, n = 0;
  (SNAP.curve || []).forEach(d => {
    if(end && d.date > end) return;
    n += 1;
    const closing = num(d.closing)
      + shifts.reduce((a, s) => a + (s.date <= d.date ? s.amount : 0), 0);
    if(headroom === null || closing < headroom){ headroom = closing; headroomDay = d.date; }
    const rate = closing / n;
    if(perDay === null || rate < perDay){ perDay = rate; perDayDay = d.date; }
  });
  return {headroom, headroomDay, perDay, perDayDay};
}

function recalc(){
  if(!SNAP) return;
  let owed = 0;
  const shifts = [];   // {date, amount} — signed, applied from that date on
  document.querySelectorAll('[data-defer]').forEach(row => {
    const on = row.querySelector('input').checked;
    const amt = num(row.getAttribute('data-amt'));
    const was = row.getAttribute('data-was') === '1';
    row.classList.toggle('on', on);
    if(on !== was) shifts.push({date: row.getAttribute('data-date'), amount: on ? amt : -amt});
    if(on) owed += amt;
  });
  const s = spendable(shifts);
  if(s.headroom === null) return;

  const box = document.getElementById('livebox');
  box.className = 'live ' + (s.perDay < 0 ? 'bad' : 'good');
  document.getElementById('liveamt').textContent = m(s.perDay) + ' a day';
  document.getElementById('liveowed').textContent =
    owed > 0 ? `${m(owed)} deferred — still owed, just moved.` : '';

  // Keep the headline card in step so the top of the page never disagrees.
  const card = document.getElementById('disccard');
  document.getElementById('discamt').textContent = m(s.perDay) + ' a day';
  card.classList.toggle('neg', s.perDay < 0);
  // "Not yet saved" only when a box has actually been moved since the engine
  // last ran — otherwise it appears against deferrals that were saved days ago.
  document.getElementById('discsub').textContent =
    (owed > 0 ? `With ${m(owed)} deferred${shifts.length ? ', not yet saved' : ''}. ` : '')
    + `${m(s.headroom)} in total through ${dt(SNAP.discretionary.window_end)}`
    + (s.headroomDay ? `, limited by ${dt(s.headroomDay)}` : '') + '. '
    + (s.headroom < 0 ? 'The bills alone do not fit.'
                      : 'Bills and income only — nothing assumed, nothing held back.');
}

async function saveDeferrals(){
  const btn = document.getElementById('savedefer');
  const msg = document.getElementById('defermsg');
  const items = [];
  document.querySelectorAll('[data-defer]').forEach(row => {
    if(row.querySelector('input').checked){
      items.push({bill_id: row.getAttribute('data-defer'), date: row.getAttribute('data-date')});
    }
  });
  btn.disabled = true; btn.textContent = 'Saving…'; msg.innerHTML = '';
  try{
    await post('/defer', {items});
    msg.innerHTML = (items.length
      ? `${items.length} deferral${items.length>1?'s':''} saved. `
      : 'All deferrals cleared. ')
      + 'The whole forecast is rebuilding — this week, upcoming, the curve and '
      + 'the risks all follow. This page refreshes when it lands.';
    pollForSnapshot();
  } catch(e){
    msg.innerHTML = e.message + ' Nothing was saved.';
  } finally {
    btn.disabled = false; btn.textContent = 'Save deferrals';
  }
}

// ---- render --------------------------------------------------------------
function render(s){
  baseline = s.generated_at;
  SNAP = s;
  const out = [];
  const negRate = num(s.discretionary.per_day) < 0;

  // The snapshot only changes when the engine runs. If it is from an earlier
  // day, every figure below is anchored to that day - including bills that have
  // since cleared. Say so in the user's terms rather than showing a stale date
  // as though it were today.
  const todayISO = new Date().toLocaleDateString('en-CA');
  const ageDays = Math.round((new Date(todayISO) - new Date(s.today)) / 86400000);
  if(ageDays > 0){
    out.push(`<div class="stale"><strong>This forecast is ${ageDays} day${ageDays>1?'s':''} old.</strong>
      It was built for ${esc(dt(s.today))} and still counts bills dated then, even
      ones that have since cleared. Update the balance to rebuild it for today.</div>`);
  } else if(!s.balance_is_fresh){
    out.push(`<div class="stale"><strong>Balance is not from today.</strong>
      Figures below project from the last entered balance. Enter today's balance
      to refresh them and send the daily summary.</div>`);
  }

  // Reading works from anywhere. Saving only works from the Worker's own
  // address, because that is where the sign-in cookie lives and no browser
  // sends one site's cookie to another. Say so here rather than letting a
  // button press fail with a network error that explains nothing.
  if(!WORKER_HOSTED && WORKER){
    out.push(`<div class="stale" style="background:#e0f2fe;border-color:#7dd3fc;color:#0c4a6e">
      <strong>To save anything, open <a href="${esc(WORKER)}/" style="color:#0369a1">${esc(WORKER)}</a>.</strong>
      This copy shows the forecast but cannot write to it. That address runs the
      same app, signs you in with an email code, and saving works there. Worth
      adding to your home screen in place of this one.</div>`);
  }

  // Until the Worker address is known nothing can be written, so say exactly
  // that and take the address here rather than failing later on a button press.
  if(!WORKER){
    out.push(`<div class="setup" id="setup">
      <h3>One-time setup</h3>
      Updating the balance, saving bill changes and marking deferrals all go
      through the OpenFIN Worker. Paste its address once and this box goes away.
      It is not a secret — it is just where to send the request.
      <div class="rowin">
        <input id="wkin" type="url" inputmode="url" autocomplete="off"
               autocapitalize="off" spellcheck="false"
               placeholder="https://openfin.yourname.workers.dev">
        <button id="wkbtn" type="button">Save</button>
      </div>
      <div class="note" id="wknote">Stored on this device. Reading the forecast
        works without it; only writing needs it.</div>
    </div>`);
  }

  out.push(`<div class="bal">
    <div class="lab">Today's balance</div>
    <div class="amt">${m(s.balance)}</div>
    <div class="when">${new Date().toLocaleDateString('en-US',{weekday:'short',day:'numeric',month:'short'})}${
      ageDays > 0 ? ' · forecast built ' + dt(s.today) : (s.balance_is_fresh ? ' · entered today' : ' · balance not yet entered today')}</div>
    <div class="entry">
      <div class="fld"><span>$</span>
        <input id="balin" type="number" inputmode="decimal" step="0.01"
               placeholder="0.00" enterkeyhint="send" autocomplete="off"></div>
      <button id="balbtn" type="button">Update</button>
    </div>
    <div class="msg" id="msg">Updating the balance runs the forecast and emails
      the daily summary.</div>
  </div>`);

  // The rate is the headline because it is the question actually being asked:
  // what can we spend day to day. The total sits underneath for one-off
  // decisions, with the day that limits it named — "you have it, but a day you
  // have not reached yet has already claimed it" is the useful part.
  const dsc = s.discretionary;
  const sub = `${m(dsc.headroom)} in total through ${dt(dsc.window_end)}`
    + (dsc.headroom_day ? `, limited by ${dt(dsc.headroom_day)}` : '') + '. '
    + (num(dsc.headroom) < 0 ? 'The bills alone do not fit.'
        : 'Bills and income only — nothing assumed, nothing held back.');
  out.push(`<div class="disc ${negRate?'neg':''}" id="disccard">
    <div class="lab">Available to spend · next ${dsc.window_days} days</div>
    <div class="amt" id="discamt">${m(dsc.per_day)} a day</div>
    <div class="sub" id="discsub">${esc(sub)}</div></div>`);

  const tb = s.today_bills, ti = s.today_income;
  out.push(tile('Today', live(tb).length ? m(sum(live(tb))) : 'Clear',
    (ti.length ? rows(ti,'in') : '') + rows(tb) + owedRow(tb, 'Held back today') +
    `<div class="row tot"><div class="l">End of day</div><div class="v">${m(s.end_of_day)}</div></div>`,
    '', true));

  const wb = s.this_week.filter(x=>x.direction==='out'), wi = s.this_week.filter(x=>x.direction==='in');
  out.push(tile('This week', m(s.end_of_week),
    `<div class="row"><div class="l">Bills to ${dt(s.week_end)}</div><div class="v">${m(sum(live(wb)))}</div></div>
     <div class="row in"><div class="l">Income</div><div class="v">+${m(sum(wi))}</div></div>
     ${owedRow(wb, 'Deferred this week')}
     <div class="row tot"><div class="l">End of week</div><div class="v">${m(s.end_of_week)}</div></div>
     <div style="margin-top:12px">${rows(s.this_week.map(x=>({...x,tier:x.direction==='in'?0:x.tier})))}</div>`));

  out.push(tile('How that is worked out', '',
    s.discretionary.explain.map(([l,v],i,a) =>
      `<div class="row ${i===a.length-1?'tot':''}"><div class="l">${esc(l)}</div>
       <div class="v">${m(v)}</div></div>`).join('')));

  out.push(tile('Upcoming', live(s.upcoming).length ? m(sum(live(s.upcoming))) : '—',
    rows(s.upcoming) + owedRow(s.upcoming, 'Deferred, still ahead')));

  const curve = s.curve || [];
  const vals = curve.map(c=>num(c.closing));
  const lo = Math.min(0,...vals), hi = Math.max(0,...vals), span = (hi-lo)||1;
  out.push(tile('Forecast', m(s.minimum_balance),
    `<div class="spark">${curve.map(c=>{const v=num(c.closing);
      return `<i class="${v<0?'neg':''}" style="height:${Math.max(1,((v-lo)/span)*100)}%"></i>`;}).join('')}</div>
     <div class="row"><div class="l">Lowest projected</div><div class="v">${m(s.minimum_balance)}${s.minimum_date?' · '+dt(s.minimum_date):''}</div></div>
     <div class="row"><div class="l">End of month</div><div class="v">${m(s.end_of_month)}</div></div>
     ${num(s.shortfall)>0?`<div class="row"><div class="l">Shortfall to cover</div><div class="v" style="color:var(--danger)">${m(s.shortfall)}</div></div>`:''}`));

  // Defer to stay afloat sits above Risk deliberately. Risk describes what is
  // going to go wrong; this is the one thing on the page that can be done about
  // it, and the thing to act on belongs above the thing to read about.
  //
  // Ticking recalculates safe-to-spend in the browser, reproducing
  // forecast.safe_discretionary exactly, so the effect of a choice is visible
  // before it is committed. Saving hands it to the engine, which remains the
  // authority: the whole snapshot is rebuilt from the new deferral set, so
  // this week, upcoming, the curve and the risks all follow.
  const win = s.deferral_window || [];
  const inWeek = win.filter(x => x.in_week);
  const beyond = win.filter(x => !x.in_week);
  const already = win.filter(x => x.deferred).length;
  // data-was is the state the engine's curve was built with. The live maths
  // shifts the curve only for boxes that have CHANGED since then.
  const line = (x) => `<label class="dfr ${x.deferred?'on':''} ${x.secured||!x.deferrable?'sec':''}"
      data-defer="${esc(x.id)}" data-date="${esc(x.date)}" data-amt="${esc(x.amount)}"
      data-inweek="${x.in_week?1:0}" data-was="${x.deferred?1:0}">
      <input type="checkbox" ${x.deferred?'checked':''}>
      <span class="nm">${esc(x.name)}
        <small>${dt(x.date)}${x.secured?' · SECURED — missing this has real consequences'
          : (!x.deferrable?' · not normally deferrable':'')}</small></span>
      <span class="amt">${m(x.amount)}</span></label>`;

  out.push(tile('Defer to stay afloat', already ? `${already} deferred` : '',
    `<div style="font-size:13px;color:var(--mute);margin-bottom:4px">
       Tick anything you are not going to pay on its date. The figure below
       updates as you tick. <strong>Deferring does not reduce what you owe</strong>
       — it moves it.</div>
     <div class="live" id="livebox">
       <div class="a" id="liveamt">${m(s.discretionary.per_day)} a day</div>
       <div class="b">available to spend a day if you defer the ticked items</div>
       <div class="owed" id="liveowed"></div>
     </div>
     ${inWeek.length ? `<div class="grp">Due this week</div>` + inWeek.map(line).join('') : ''}
     ${beyond.length ? `<div class="grp">Next ${s.lookahead_days} days</div>` + beyond.map(line).join('') : ''}
     <div style="margin-top:14px;display:flex;gap:10px;align-items:center">
       <button id="savedefer" type="button" style="border:0;border-radius:10px;
         background:var(--teal);color:#04231e;font-weight:800;font-size:14px;
         padding:11px 18px;font-family:inherit;cursor:pointer">Save deferrals</button>
       <span id="defermsg" style="font-size:13px;color:var(--mute)"></span></div>`,
    '', num(s.discretionary.per_day) < 0));

  const rk = s.risks || [];
  out.push(tile('Risk', rk.length ? `${rk.length}` : 'Clear',
    (rk.length
      ? rk.map(r=>`<div class="sev">${esc(r.severity)}</div><h4>${esc(r.title)}</h4>
          <p>${esc(r.detail)}</p>`).join('')
        + (s.plan && s.plan.problem_day ? `<div class="plan"><strong>What could be done</strong><br>${esc(s.plan.summary)}</div>` : '')
      : '<div class="ok">No material financial risks detected.</div>'),
    rk.length ? 'risk' : '', rk.length > 0));

  // Edit bills — routine amount and day changes, saved permanently and synced
  // to every device because the model lives in the repo, not on a phone.
  // Ordered by when each next falls due; the engine works that out, because a
  // biweekly bill has no day of the month to sort on.
  const editable = (s.bills || []).filter(b => b.active);
  const gone = (s.bills || []).filter(b => !b.active);
  out.push(tile('Edit bills', `${editable.length}`,
    `<div style="font-size:13px;color:var(--mute);margin-bottom:10px">
       In the order they next fall due. Change an amount or the day it lands,
       or remove one that has ended. Saved for both phones. Leave a box
       untouched to keep it as it is.</div>`
    + editable.map(b => `<div class="row" data-bill="${esc(b.id)}">
        <div class="l"><span class="nm">${esc(b.name)}</span><span class="pill t${b.tier}">T${b.tier}</span>
          <small>${b.next_date?dt(b.next_date)+' · ':''}${esc(b.frequency)}${b.variable?' · varies':''}${b.needs_review?' · needs review':''}</small></div>
        <div class="v" style="display:flex;gap:6px;align-items:center">
          <input class="e-amt" type="number" inputmode="decimal" step="0.01"
                 value="${esc(b.amount)}" style="width:88px;padding:7px 8px;border:1px solid var(--line);
                 border-radius:8px;font:inherit;font-size:14px;text-align:right">
          <input class="e-day" type="number" inputmode="numeric" min="1" max="31"
                 value="${b.due_day ?? ''}" placeholder="–"
                 title="Day of month${b.due_day===null?' (not used for this frequency)':''}"
                 ${b.due_day===null?'disabled':''}
                 style="width:48px;padding:7px 8px;border:1px solid var(--line);
                 border-radius:8px;font:inherit;font-size:14px;text-align:center">
          <button class="e-del" type="button" title="Remove this bill"
                  aria-label="Remove ${esc(b.name)}">×</button>
        </div></div>`).join('')
    + `<div style="margin-top:14px;display:flex;gap:10px;align-items:center">
         <button id="savebills" type="button" style="border:0;border-radius:10px;
           background:var(--teal);color:#04231e;font-weight:800;font-size:14px;
           padding:11px 18px;font-family:inherit;cursor:pointer">Save changes</button>
         <span id="editmsg" style="font-size:13px;color:var(--mute)"></span></div>`
    // Removed bills are kept and listed, never dropped from the file — the
    // history is keyed to the id, and a bill that turns out to still be live
    // has to be able to come back.
    + (gone.length
        ? `<div class="grp" style="margin-top:18px">Removed, kept for history</div>`
          + gone.map(b => `<div class="row" data-bill="${esc(b.id)}" data-inactive="1">
               <div class="l"><span class="nm" style="color:var(--mute)">${esc(b.name)}</span>
                 <small>${esc(b.frequency)} · ${m(b.amount)} · not counted in the forecast</small></div>
               <div class="v"><button class="e-restore" type="button">Restore</button></div>
             </div>`).join('')
        : '')));

  // Income — what is already counted, and a way to add more. The existing list
  // sits above the form deliberately: adding a paycheque that is already
  // modelled double-counts it, and the effect is invisible because the forecast
  // simply gets better. Seeing the list first is the only guard against that.
  const inc = s.income || [];
  const liveInc = inc.filter(x => x.active);
  const oldInc = inc.filter(x => !x.active);
  const freqLabel = {once:'one-off', weekly:'weekly', biweekly:'every 2 weeks',
    semimonthly:'twice a month', monthly:'monthly', quarterly:'quarterly',
    annual:'yearly'};
  out.push(tile('Income', `${liveInc.length}`,
    liveInc.map(x => `<div class="row" data-income="${esc(x.id)}">
        <div class="l"><span class="nm">${esc(x.name)}</span>
          <small>${x.next_date?dt(x.next_date)+' · ':''}${esc(freqLabel[x.frequency]||x.frequency)}${
            x.needs_review?' · needs review':''}</small></div>
        <div class="v in" style="display:flex;gap:8px;align-items:center">
          <span style="color:var(--ok)">+${m(x.amount)}</span>
          <button class="i-del" type="button" title="Remove this income"
                  aria-label="Remove ${esc(x.name)}">×</button>
        </div></div>`).join('')
    + (liveInc.length ? '' : '<div class="empty">No income is being counted.</div>')
    + (oldInc.length
        ? `<div class="grp" style="margin-top:16px">Removed, kept for history</div>`
          + oldInc.map(x => `<div class="row" data-income="${esc(x.id)}" data-inactive="1">
               <div class="l"><span class="nm" style="color:var(--mute)">${esc(x.name)}</span>
                 <small>${esc(freqLabel[x.frequency]||x.frequency)} · ${m(x.amount)} · not counted</small></div>
               <div class="v"><button class="i-restore" type="button">Restore</button></div>
             </div>`).join('')
        : '')
    + `<div class="grp" style="margin-top:18px">Add income</div>
       <div style="font-size:13px;color:var(--mute);margin-bottom:10px">
         Only money that actually lands in this account. Anything added here is
         counted in the forecast straight away and flagged for review until it
         has been seen on a statement.</div>
       <div class="addinc">
         <input id="inc-name" type="text" placeholder="What is it? e.g. Side work"
                autocomplete="off" maxlength="60">
         <div class="two">
           <div class="fld"><span>$</span>
             <input id="inc-amt" type="number" inputmode="decimal" step="0.01"
                    placeholder="0.00" autocomplete="off"></div>
           <select id="inc-freq">
             <option value="once">Just once</option>
             <option value="weekly">Every week</option>
             <option value="biweekly">Every 2 weeks</option>
             <option value="semimonthly">Twice a month</option>
             <option value="monthly" selected>Every month</option>
             <option value="quarterly">Every 3 months</option>
             <option value="annual">Every year</option>
           </select>
         </div>
         <label class="dl" for="inc-date"><span id="inc-datelab">When is the first one?</span>
           <input id="inc-date" type="date"></label>
         <div style="display:flex;gap:10px;align-items:center;margin-top:12px">
           <button id="addinc" type="button">Add income</button>
           <span id="incmsg" style="font-size:13px;color:var(--mute)"></span>
         </div>
       </div>`));

  out.push(tile('Settings', '',
    `<div class="row"><div class="l">Available-to-spend window
         <small>how far ahead the figure at the top looks</small></div>
       <div class="v">${dsc.window_days} days</div></div>
     <div class="row"><div class="l">Assumed everyday spending
         <small>none — the daily figure is derived, not deducted</small></div>
       <div class="v">${m(s.settings.daily_discretionary_allowance)}</div></div>
     <div class="row"><div class="l">Cash buffer held back
         <small>none — ${m(s.settings.minimum_safe_balance)} is an alert line only</small></div>
       <div class="v">$0.00</div></div>
     <div class="row"><div class="l">Forecast horizon</div><div class="v">${s.settings.forecast_days} days</div></div>
     <div class="row"><div class="l">Sign-in</div>
       <div class="v">Cloudflare Access</div></div>`));

  document.getElementById('app').innerHTML = out.join('');
  const wk = document.getElementById('wkbtn');
  if(wk) wk.addEventListener('click', saveWorkerUrl);
  const wki = document.getElementById('wkin');
  if(wki) wki.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); saveWorkerUrl(); }
  });

  document.getElementById('balbtn').addEventListener('click', submitBalance);
  document.getElementById('balin').addEventListener('keydown', e => {
    if(e.key === 'Enter') submitBalance();
  });
  const sb = document.getElementById('savebills');
  if(sb) sb.addEventListener('click', saveEdits);
  // Remember which day boxes were already disabled (frequencies with no day of
  // the month), so un-staging a removal does not enable one that never applied.
  document.querySelectorAll('[data-bill] input').forEach(i => {
    if(i.disabled) i.dataset.wasDisabled = '1';
  });
  document.querySelectorAll('.e-del').forEach(b =>
    b.addEventListener('click', () => markRemoval(b.closest('[data-bill]'))));
  document.querySelectorAll('.e-restore').forEach(b =>
    b.addEventListener('click', () => markRestore(b.closest('[data-bill]'))));

  const ai = document.getElementById('addinc');
  if(ai) ai.addEventListener('click', addIncome);
  const ifq = document.getElementById('inc-freq');
  if(ifq){ ifq.addEventListener('change', incomeDateLabel); incomeDateLabel(); }
  document.querySelectorAll('.i-del').forEach(b =>
    b.addEventListener('click', () => setIncomeActive(b.closest('[data-income]'), false)));
  document.querySelectorAll('.i-restore').forEach(b =>
    b.addEventListener('click', () => setIncomeActive(b.closest('[data-income]'), true)));
  const sd = document.getElementById('savedefer');
  if(sd) sd.addEventListener('click', saveDeferrals);
  document.querySelectorAll('[data-defer] input').forEach(cb =>
    cb.addEventListener('change', recalc));
  recalc();
  document.getElementById('foot').textContent =
    'OpenFIN · forecast generated ' + new Date(s.generated_at).toLocaleString('en-US')
    + (ageDays > 0 ? '  (' + ageDays + ' day' + (ageDays>1?'s':'') + ' old)' : '');
}

// Resolve the Worker address first, so the first render already knows whether
// to show the setup box. A missing app.json is not fatal — loadWorkerUrl()
// swallows it and the setup box covers the gap.
loadWorkerUrl()
  .then(() => fetch('snapshot.json?t=' + Date.now()))
  .then(r => { if(!r.ok) throw new Error('snapshot.json ' + r.status); return r.json(); })
  .then(render)
  .catch(e => {
    document.getElementById('app').innerHTML =
      `<div class="err"><strong>No forecast available.</strong><br>${esc(e.message)}<br><br>
       The engine has not produced a snapshot yet.</div>`;
  });
</script>
</body>
</html>
