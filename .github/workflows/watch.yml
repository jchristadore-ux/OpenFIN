name: Risk watch

# The early-warning half of the system. Runs on a schedule and needs no balance
# entry, so the app's figures and its Risk tile stay current twice a day.
#
# It does NOT email. `risk_emails_enabled` is false in config.json: the daily
# summary, which carries the risk list itself, is the only email that sends.
# The SMTP secrets are still passed in so that flipping that one value in
# config.json is all it takes to turn alerts back on. Deduplication lives in
# state.json and only applies when they are on.

on:
  schedule:
    - cron: '0 11 * * *'   # ~7am Eastern
    - cron: '0 21 * * *'   # ~5pm Eastern
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview alerts without sending'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: openfin-engine
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet requests openpyxl

      - name: Scan for risk and rebuild the snapshot
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          python src/engine.py watch \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Commit alert state
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "OpenFIN"
          git config user.email "noreply@github.com"
          git add state.json snapshot.json || true
          git diff --staged --quiet || git commit -m "Risk watch $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
