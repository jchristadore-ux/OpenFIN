name: Daily balance

# Updating the balance in the app is what runs the engine and sends the daily
# summary. There is no separate "balance received" email, and no email is used
# to submit a balance.
#
#   repository_dispatch  the app posts event_type "balance" with the amount
#   workflow_dispatch    manual fallback from the Actions tab
#
# The daily summary sends ONLY from here. Nothing on a timer sends it, because
# a summary anchored to a stale balance reads as authoritative and is quietly
# wrong.

on:
  repository_dispatch:
    types: [balance, bills, defer]
  workflow_dispatch:
    inputs:
      balance:
        description: "Today's actual bank balance (e.g. 4382.17)"
        required: true
        type: string
      dry_run:
        description: 'Preview the email without sending'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: openfin-engine
  cancel-in-progress: false

jobs:
  balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet requests openpyxl

      - name: Apply bill edits, if this run carries any
        if: github.event.action == 'bills'
        env:
          EDITS: ${{ github.event.client_payload.edits }}
        run: |
          python src/apply_edits.py "$EDITS"
          git config user.name  "OpenFIN"
          git config user.email "noreply@github.com"
          git add bills.json
          git diff --staged --quiet || git commit -m "Bill edits from the app"

      - name: Rebuild the forecast after an edit
        # An edit changes the model, so the forecast is rebuilt and the summary
        # re-sent using the balance already on file. No balance is required.
        if: github.event.action == 'bills'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: python src/engine.py watch

      - name: Record deferrals
        if: github.event.action == 'defer'
        env:
          ITEMS: ${{ github.event.client_payload.items }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: python src/engine.py defer --items "$ITEMS"

      - name: Read the balance
        if: github.event.action != 'bills' && github.event.action != 'defer'
        id: read
        env:
          FROM_APP: ${{ github.event.client_payload.balance }}
          FROM_DISPATCH: ${{ github.event.inputs.balance }}
        run: |
          RAW="${FROM_APP:-$FROM_DISPATCH}"
          CLEAN=$(printf '%s' "$RAW" | tr -d '$, ')
          # Refuse anything that is not a plain number. The value arrives from a
          # browser and is interpolated into a shell, so it is validated here
          # rather than trusted.
          if ! printf '%s' "$CLEAN" | grep -qE '^-?[0-9]+(\.[0-9]{1,2})?$'; then
            echo "::error::'$RAW' is not a valid balance"; exit 1
          fi
          echo "balance=$CLEAN" >> "$GITHUB_OUTPUT"
          echo "Balance read: $CLEAN"

      - name: Run the engine and send the daily summary
        # Balance entries only. A deferral has already rebuilt the snapshot in
        # `defer` mode above; running `daily` after it re-sent the whole daily
        # summary as though a balance had just been entered, off a balance that
        # might be days old. Saving a deferral is not a reading of the account.
        if: github.event.action != 'bills' && github.event.action != 'defer'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          python src/engine.py daily \
            --balance "${{ steps.read.outputs.balance }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Commit the new state and snapshot
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "OpenFIN"
          git config user.email "noreply@github.com"
          git add state.json snapshot.json logs/ || true
          git diff --staged --quiet || \
            git commit -m "${{ github.event.action == 'defer' && 'Deferrals updated'
                            || github.event.action == 'bills' && 'Forecast rebuilt after bill edits'
                            || format('Balance {0}', steps.read.outputs.balance) }}"
          git push
