name: Daily balance

# Balance entry, from a phone, with no server and no hosting cost.
#
# Two ways in, both free:
#   * File the "Daily balance" issue from the GitHub mobile app. The issue is
#     parsed, the engine runs, the result is posted back as a comment and the
#     issue closes itself.
#   * Run this workflow by hand from the Actions tab with a balance input.
#
# Entering a balance is what sends the daily email. Nothing else does.

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      balance:
        description: "Today's actual bank balance (e.g. 4382.17)"
        required: true
        type: string
      dry_run:
        description: 'Preview the email without sending'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: togetherledger-engine
  cancel-in-progress: false

jobs:
  balance:
    # Ignore every issue that is not a balance entry.
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(join(github.event.issue.labels.*.name, ','), 'balance')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet requests openpyxl

      - name: Read the balance
        id: read
        env:
          DISPATCH_BALANCE: ${{ github.event.inputs.balance }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          if [ -n "$DISPATCH_BALANCE" ]; then
            RAW="$DISPATCH_BALANCE"
          else
            # First number that looks like money anywhere in the issue body.
            RAW=$(printf '%s' "$ISSUE_BODY" | grep -oE '\-?\$?[0-9][0-9,]*(\.[0-9]{2})?' | head -1)
          fi
          CLEAN=$(printf '%s' "$RAW" | tr -d '$,' )
          if [ -z "$CLEAN" ]; then
            echo "No balance found in the input." >&2
            exit 1
          fi
          echo "balance=$CLEAN" >> "$GITHUB_OUTPUT"

      - name: Run the engine
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          python src/engine.py daily \
            --balance "${{ steps.read.outputs.balance }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} \
            | tee engine-output.txt

      - name: Commit the new state
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "TogetherLedger"
          git config user.email "noreply@github.com"
          git add state.json snapshot.json logs/ || true
          git diff --staged --quiet || git commit -m "Balance ${{ steps.read.outputs.balance }}"
          git push

      - name: Reply on the issue and close it
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Balance recorded: \$${{ steps.read.outputs.balance }}"
            echo
            echo '```'
            cat engine-output.txt
            echo '```'
            echo
            echo "Daily check emailed. Dashboard updated."
          } > reply.md
          gh issue comment "${{ github.event.issue.number }}" --body-file reply.md
          gh issue close "${{ github.event.issue.number }}"
