name: Ingest uploaded bills

# Fires when you drag a screenshot or spreadsheet into inbox/ and commit it
# from the GitHub web UI. inbox/processed/ is excluded so the workflow's own
# tidy-up does not re-trigger it. (Pushes made with GITHUB_TOKEN don't trigger
# workflows anyway — this is belt and braces.)
on:
  push:
    paths:
      - 'inbox/**'
      - '!inbox/processed/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Show the diff without writing bills.json or sending a text'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: cashflow-bills
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet requests openpyxl

      - name: Read the upload and diff it against bills.json
        env:
          PYTHONPATH: src
          DRY_RUN: ${{ inputs.dry_run }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: python src/parse_upload.py

      - name: Verify the merged bill list still loads
        # This called src/selftest.py, which was deleted in the rebuild — it
        # tested the SimpleFIN and projection modules that went with it, and CI
        # now refuses to let either return. So every upload since has failed
        # here, after writing bills.json and before the commit step could run.
        # The check the step was named for is the one below: whatever the parser
        # merged in has to survive a real load, or the next engine run dies on
        # data nobody looked at.
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, 'src')
          from pathlib import Path
          from bills import load_items
          b = load_items(Path('bills.json'), 'bills')
          i = load_items(Path('income.json'), 'income')
          print(f"{len(b)} bills, {len(i)} income sources validate")
          PY

      - name: Commit the updated bill list
        if: always()
        run: |
          git config user.name  "cashflow-bot"
          git config user.email "cashflow-bot@users.noreply.github.com"
          git add bills.json inbox/
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Bills updated from upload"
          git push
