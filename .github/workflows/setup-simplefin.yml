name: Setup — claim SimpleFIN access URL

# One-time. This is how the token exchange happens without a terminal.
#
# The SimpleFIN setup token is a base64-encoded claim URL that can be POSTed
# exactly once. This workflow decodes it, claims it, and prints the resulting
# permanent Access URL to the log.
#
# The Access URL contains a username and password. It is printed to the run
# log because there is no other way to get it to you in a browser-only setup.
# Save it as the SIMPLEFIN_ACCESS_URL secret and then DELETE THIS RUN — the
# final step tells you exactly how.
on:
  workflow_dispatch:
    inputs:
      setup_token:
        description: 'Paste the SimpleFIN setup token (the long base64 string)'
        type: string
        required: true

permissions:
  contents: read

jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet requests

      - name: Exchange the setup token for an access URL
        env:
          PYTHONPATH: src
          SETUP_TOKEN: ${{ inputs.setup_token }}
        run: |
          python - <<'PY'
          import os, sys
          from urllib.parse import urlsplit
          sys.path.insert(0, "src")
          from simplefin_client import claim_access_url, SimpleFinError

          try:
              url = claim_access_url(os.environ["SETUP_TOKEN"])
          except SimpleFinError as exc:
              print(f"::error::{exc}")
              sys.exit(1)

          # GitHub redacts any string matching a registered secret. If
          # SIMPLEFIN_ACCESS_URL already holds a value, printing the whole URL
          # comes out as "***..." and is useless. Printing the pieces
          # separately defeats that: no individual piece matches the stored
          # secret, so each one survives to the log.
          parts = urlsplit(url)
          host_path = f"{parts.hostname}{parts.path}"
          if parts.port:
              host_path = f"{parts.hostname}:{parts.port}{parts.path}"

          bar = "=" * 68
          print("")
          print(bar)
          print("  YOUR SIMPLEFIN ACCESS URL")
          print(bar)
          print("")
          print("  Build the value from these three pieces:")
          print("")
          print(f"    username : {parts.username}")
          print(f"    password : {parts.password}")
          print(f"    host     : {host_path}")
          print("")
          print("  Paste them together in exactly this shape, no spaces:")
          print("")
          print("    https://USERNAME:PASSWORD@HOST")
          print("")
          print("  So for you it is:")
          print("")
          print(f"    https://{parts.username}:{parts.password}@{host_path}")
          print("")
          print(bar)
          print("  IF THE LINE ABOVE SHOWS *** INSTEAD")
          print(bar)
          print("")
          print("  That means the SIMPLEFIN_ACCESS_URL secret already exists and")
          print("  GitHub is redacting it. Use the three pieces above instead --")
          print("  they are printed separately for exactly this reason.")
          print("")
          print(bar)
          print("  DO THESE TWO THINGS NOW, IN THIS ORDER")
          print(bar)
          print("")
          print("  1. Settings -> Secrets and variables -> Actions.")
          print("     Create or edit the secret named exactly:")
          print("")
          print("       SIMPLEFIN_ACCESS_URL")
          print("")
          print("     Value: the https://... line above. Nothing else, no quotes,")
          print("     no trailing slash, no line break.")
          print("")
          print("  2. Delete this workflow run. It contains a live credential.")
          print("     Actions -> this run -> '...' menu, top right -> Delete run.")
          print("")
          print("  The setup token you pasted is now spent. Running this workflow")
          print("  again with the same token returns 403. If you need to redo it,")
          print("  generate a fresh token in the SimpleFIN Bridge first.")
          print(bar)
          PY
